# hadolint 設定（超厳格・例外は最小限かつ理由を明記）。
# `pre-commit run hadolint` / `hadolint --failure-threshold info Dockerfile`
# はこのファイルを自動的に読み込む。
ignored:
  # DL3008: apt パッケージのバージョン固定。
  # このDockerfileは「常に最新のツールチェーンを取得する」ことを目的とした
  # 開発用サンドボックスのベースイメージであり、20以上のaptパッケージを
  # 個別にバージョン固定すると Ubuntu ミラーのローテーションで数週間以内に
  # ビルド不能になる。セキュリティパッチを自動的に取り込む方を優先する。
  - DL3008
  # DL3016: npm パッケージのバージョン固定。理由はDL3008と同様（開発ツールは
  # 常に最新を取得する方針）。
  - DL3016
  # DL3059: 連続するRUN命令の統合。本Dockerfileは意図的にRUNを分割している
  # 箇所がある（例: claude-code/opencode-aiの個別installはnpmの
  # optionalDependencies既知不具合を避けるため。各installの直後に
  # `--version` 検証RUNを挟むのはビルド時に壊れたインストールを検出するため）。
  # レイヤー数削減よりも可読性・キャッシュ粒度・検証性を優先する。
  - DL3059
  # SC2016: oh-my-posh の初期化コマンドを ~/.bashrc に「文字どおり」書き込む
  # ために意図的にシングルクォートで $(...) の展開を防いでいる（ビルド時では
  # なく、シェル起動のたびに評価させるため）。既知の意図的パターンであり
  # 誤検出である。
  - SC2016
